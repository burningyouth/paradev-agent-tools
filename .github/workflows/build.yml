name: Build Paradev Agent Tools

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check packages on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check version
        id: version
        shell: bash
        run: |
          version="$(jq -r .version mcp/plugin.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a version in X.Y.Z format in mcp/plugin.json"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match plugin version v$version"
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: go test ./...
      - run: go vet ./...
      - name: Build and test packages
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          artifact="paradev-agent-tools-$VERSION"
          archive="dist/$artifact.tar.gz"
          clients="dist/$artifact-clients.tar.gz"
          go run ./cmd/pack -clients "$clients" "$archive"

          unpacked="$(mktemp -d)"
          trap 'rm -rf "$unpacked"' EXIT
          distribution="$unpacked/Paradev Agent Tools"
          tar -xzf "$archive" -C "$unpacked"
          test -x "$distribution/Install.command"
          test -x "$distribution/Install.sh"
          package="$distribution/paradev-agent-tools"
          test -x "$package/launch"
          test ! -e "$package/runtime"
          test ! -e "$package/src"
          test ! -e "$package/bin/agent.js"
          mkdir "$unpacked/clients"
          tar -xzf "$clients" -C "$unpacked/clients"
          diff -r "$package" "$unpacked/clients/plugins/paradev-agent-tools"
          test -f "$unpacked/clients/.agents/plugins/marketplace.json"
          jq -e --arg version "$VERSION" '.version == $version' "$unpacked/clients/package.json"
          node --check "$unpacked/clients/opencode.js"
          TEST_MCP_PACKAGE="$package" node --test test/mcp.test.js test/self-close.test.js test/chat-relay.test.js test/commit.test.js test/skills.test.js
          printf 'name=%s\narchive=%s\nclients=%s\n' "$artifact" "$archive" "$clients" >> "$GITHUB_OUTPUT"
      - name: Install and start MCP in Linux without Node, npm or Go
        if: runner.os == 'Linux'
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          docker run --rm --network none -v "$PWD/$ARCHIVE:/package.tar.gz:ro" ubuntu:24.04 /bin/sh -eu -c '
            for tool in node npm go; do
              if command -v "$tool"; then exit 1; fi
            done
            export HOME=/tmp/test-home
            mkdir -p "$HOME" /tmp/package
            tar -xzf /package.tar.gz -C /tmp/package
            "/tmp/package/Paradev Agent Tools/Install.sh" manual --json
            {
              printf "%s\n" "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-11-25\",\"capabilities\":{},\"clientInfo\":{\"name\":\"smoke\",\"version\":\"1\"}}}"
              sleep 1
            } | "$HOME/.codex/plugins/multi-agent-mcp/launch" > /tmp/initialize.json
            cat /tmp/initialize.json
            grep -q "\"name\":\"multi-agent-mcp\"" /tmp/initialize.json
          '
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}-clients
          path: ${{ steps.package.outputs.clients }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Publish release and client packages
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref_type == 'tag')
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: paradev-agent-tools-release
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check whether the version changed
        id: release
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          version="$(jq -r .version mcp/plugin.json)"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main &&
                -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            if ! git cat-file -e "$PUSH_BEFORE^{commit}"; then
              git fetch --no-tags origin "$PUSH_BEFORE"
            fi
            if git cat-file -e "$PUSH_BEFORE:mcp/plugin.json" 2>/dev/null; then
              previous="$(git show "$PUSH_BEFORE:mcp/plugin.json" | jq -r .version)"
              if [[ "$previous" == "$version" ]]; then
                echo "Version $version is unchanged."
                exit 0
              fi
            fi
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.version != ''
        uses: actions/download-artifact@v8
        with:
          pattern: paradev-agent-tools-*
          path: dist
          merge-multiple: true
      - name: Publish tested packages
        if: steps.release.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          version="$VERSION"
          tag="v$version"
          source="$(git rev-parse HEAD)"
          archive="dist/paradev-agent-tools-$version.tar.gz"
          clients="dist/paradev-agent-tools-$version-clients.tar.gz"
          test -s "$archive"
          test -s "$clients"

          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          package="$staging/package"
          mkdir "$package"
          tar -xzf "$clients" -C "$package"
          export GIT_INDEX_FILE="$staging/index"
          git --work-tree="$package" add -A -f
          tree="$(git write-tree)"

          ref=refs/heads/distribution
          parent=()
          unchanged=false
          remote_branch="$(git ls-remote origin "$ref")"
          if [[ -n "$remote_branch" ]]; then
            git fetch --no-tags origin "$ref"
            head="$(git rev-parse FETCH_HEAD)"
            parent=(-p "$head")
            current="$(git show "$head:package.json" | jq -r .version)"
            if [[ "$current" == "$version" ]]; then
              if [[ "$tree" != "$(git rev-parse "$head^{tree}")" ]]; then
                echo "::error::Version $version was already published with different files."
                exit 1
              fi
              unchanged=true
            elif [[ "$(printf '%s\n' "$current" "$version" | sort -V | tail -n 1)" == "$current" ]]; then
              echo "::error::Version $version is older than the client distribution $current."
              exit 1
            fi
          fi

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$source" ]]; then
              echo "::error::Tag $tag already points to another commit."
              exit 1
            fi
          else
            git push origin "$source:refs/tags/$tag"
          fi

          release="$staging/release.json"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft > "$release"; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft \
              --title "Paradev Agent Tools $version"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft > "$release"
          fi

          # Stable names let GitHub's latest-release URL serve the current installer.
          installer_name=paradev-agent-tools.tar.gz
          clients_name=paradev-agent-tools-clients.tar.gz
          cp "$archive" "$staging/$installer_name"
          cp "$clients" "$staging/$clients_name"
          missing=()
          for name in "$installer_name" "$clients_name"; do
            if ! jq -e --arg name "$name" 'any(.assets[]; .name == $name)' "$release" > /dev/null; then
              missing+=("$staging/$name")
            fi
          done
          if (( ${#missing[@]} )); then
            gh release upload "$tag" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft > "$release"
          fi
          for name in "$installer_name" "$clients_name"; do
            jq -e --arg name "$name" \
              'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' "$release" > /dev/null
          done

          if [[ "$unchanged" == false ]]; then
            commit="$(git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit-tree "$tree" "${parent[@]}" -m "Release $tag")"
            git push origin "$commit:$ref"
          fi

          if jq -e '.isDraft' "$release" > /dev/null; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
